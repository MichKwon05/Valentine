<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi niño <3 </title>
  <link rel="stylesheet" href="./css/disco.css">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="loading" class="loading-screen">
    <div class="progress"></div>
  </div>

  <div class="container">
    <div class="left-half">
      <div class="album">
        <div class="card">
          <img src="./assets/cover.png" alt="Album Cover">
        </div>
        <div class="outer">
          <div class="inner">
            <img src="./assets/heart.png" alt="Vinyl Image">
          </div>
        </div>
      </div>
      <audio controls src="./assets/Until_I_found_you.m4a" type="audio/mpeg" class="audio-player"></audio>
    </div>

    <div class="right-half">
      <div class="note note-1">
        <p>I was lost within the darkness, but then I found her</p>
      </div>
      <div class="note note-2">
        <p>I found you ...</p>
      </div>
      <div class="note note-3">
        <p>I'll never let you go again </p>
      </div>
    </div>
  </div>
  <script src="./js/disco.js"></script>
</body>
</html>
